on:
  push:
    branches:    
      - master
      
  workflow_dispatch:

concurrency: 
  group: ${{ github.workflow }}
  cancel-in-progress: true
 
name: build-and-deploy-hetzner
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@master
    
    - name: Use Node.js 12.x
      uses: actions/setup-node@v1
      with:
        node-version: '12.x'
        
    - name: Build webapp
      run: |
        make webapp/setup
        make webapp/build
     
    - name: Build hugo
      run: |
        make hugo/build
      
      
      # sftp action fails with dirty files in repo
      # we must reset these files
      # modified:   app/frontend/package-lock.json
      # modified:   hugo/layouts/index.gen.html
      # this works because ./public is not in git index
    - name: Prepare SFTP
      run: |
        git reset --hard
    - name: List output files
      run: |
        ls -al
        ls -al ./public
        ls -al ./public/blog/
        git status
    
    
    - name: Install deployment tools
      run: |
        sudo apt-get update
        sudo apt-get install -y rsync sshpass
    
    - name: Configure SSH host key
      env:
        DEPLOY_HOST: ${{ secrets.HSERVER }}
      run: |
        test -n "$HSERVER" || {
          echo "HSERVER secret is missing"
          exit 1
        }
    
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        ssh-keyscan -H -p 22 "$DEPLOY_HOST" >> ~/.ssh/known_hosts
    
    - name: Deploy with rsync
      timeout-minutes: 10
      env:
        SSHPASS: ${{ secrets.HPASSWORD }}
        DEPLOY_HOST: ${{ secrets.HSERVER }}
        DEPLOY_USER: ${{ secrets.HUSERNAME }}
      run: |
        sshpass -e rsync \
          --archive \
          --compress \
          --itemize-changes \
          --stats \
          --human-readable \
          -e "ssh -p 22" \
          public/ \
          "$DEPLOY_USER@$DEPLOY_HOST:/public_html/"
