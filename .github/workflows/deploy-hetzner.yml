on:
  push:
    branches:    
      - master
      
  workflow_dispatch:

concurrency: 
  group: ${{ github.workflow }}
  cancel-in-progress: true
 
name: build-and-deploy-hetzner
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@master
    
    - name: Use Node.js 12.x
      uses: actions/setup-node@v1
      with:
        node-version: '12.x'
        
    - name: Build webapp
      run: |
        make webapp/setup
        make webapp/build
     
    - name: Build hugo
      run: |
        make hugo/build
      
      
      # sftp action fails with dirty files in repo
      # we must reset these files
      # modified:   app/frontend/package-lock.json
      # modified:   hugo/layouts/index.gen.html
      # this works because ./public is not in git index
    - name: Prepare SFTP
      run: |
        git reset --hard
    - name: List output files
      run: |
        ls -al
        ls -al ./public
        ls -al ./public/blog/
        git status
    
    
    - name: Install deployment tools
      run: |
        sudo apt-get update
        sudo apt-get install -y lftp
    
    - name: Configure SSH host key
      env:
        DEPLOY_HOST: ${{ secrets.HSERVER }}
      run: |
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        ssh-keyscan -H -p 22 "$DEPLOY_HOST" >> ~/.ssh/known_hosts
        chmod 600 ~/.ssh/known_hosts
    
    - name: Deploy via SFTP
      timeout-minutes: 10
      env:
        DEPLOY_HOST: ${{ secrets.HSERVER }}
        DEPLOY_USER: ${{ secrets.HUSERNAME }}
        DEPLOY_PASSWORD: ${{ secrets.HPASSWORD }}
      run: |
        lftp <<EOF
        set cmd:fail-exit yes
        set net:max-retries 2
        set net:timeout 30
        set sftp:connect-program "ssh -a -x -p 22"
        open -u "$DEPLOY_USER","$DEPLOY_PASSWORD" "sftp://$DEPLOY_HOST"
        mirror --reverse --verbose --parallel=4 --no-perms public/ /public_html/
        bye
        EOF
